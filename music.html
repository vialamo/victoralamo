<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Alamo - Music</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar"></div>
  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;

        // hamburger menu toggle
        const toggle = document.querySelector(".menu-toggle");
        const navlinks = document.querySelector(".nav-links");

        toggle.addEventListener("click", () => {
          navlinks.classList.toggle("show");
        });
        
        // highlight active link after navbar is loaded
        const current = window.location.pathname.split("/").pop(); 
        const links = document.querySelectorAll("#navbar ul a");
        links.forEach(link => {
          if (link.getAttribute("href") === current) {
            link.classList.add("active");
          }
        });
      });
  </script>

  <script>
    function flipPage(containerId, direction) {
      const container = document.getElementById(containerId);
      const img = container.querySelector('.score-img');

      // Pull settings from the data attributes
      const baseName = img.getAttribute('data-base');
      const totalPages = parseInt(img.getAttribute('data-total'));
      let current = parseInt(img.getAttribute('data-current'));

      // Calculate next page
      let next = current + direction;

      // Logic: Only flip if within bounds (1 to total)
      if (next >= 1 && next <= totalPages) {
          // 1. Update the image source to your format
          img.src = `scores/${baseName}-${next}.svg`;
          
          // 2. Update the internal tracker
          img.setAttribute('data-current', next);
      }
    }

    /* --- LIGHTBOX LOGIC --- */
    let activeLightboxSection = null;

    function openLightbox(sectionId) {
      activeLightboxSection = sectionId;
      const section = document.getElementById(sectionId);
      const img = section.querySelector('.score-img');
      const lightbox = document.getElementById('score-lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      
      // Copy current image to lightbox
      lightboxImg.src = img.src;
      
      // Show lightbox and lock background scrolling
      lightbox.style.display = 'flex';
      document.body.style.overflow = 'hidden'; 
    }

    function closeLightbox() {
      document.getElementById('score-lightbox').style.display = 'none';
      document.body.style.overflow = ''; // Restore background scrolling
      activeLightboxSection = null;
    }

    function flipLightbox(direction) {
      if (!activeLightboxSection) return;
      
      // Flip the underlying original inline page
      flipPage(activeLightboxSection, direction);
      
      // Sync the lightbox image to the newly flipped inline image
      const section = document.getElementById(activeLightboxSection);
      const img = section.querySelector('.score-img');
      document.getElementById('lightbox-img').src = img.src;
    }

    // Allow keyboard navigation in the lightbox
    document.addEventListener('keydown', function(e) {
      if (document.getElementById('score-lightbox').style.display === 'flex') {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') flipLightbox(-1);
        if (e.key === 'ArrowRight') flipLightbox(1);
      }
    });

    // Automatically pause all other audio players when a new one starts
    document.addEventListener('play', function(e) {
      if (e.target.tagName === 'AUDIO') {
        const audios = document.querySelectorAll('audio');
        audios.forEach(audio => {
          if (audio !== e.target) {
            audio.pause();
          }
        });
      }
    }, true); // 'true' uses the capture phase, which is required since 'play' events don't bubble
  </script>

  <main>
    <p class="section-subtitle">Featured works</p>
    <div class="gallery-container">

      <!-- La noia i la mar -->
      <section class="composition-block" id="noia-section">
        <div class="score-container">
          <div class="score-viewport">
            <img class="score-img enlargeable" 
                onclick="openLightbox('noia-section')"
                title="Click to enlarge"
                src="scores/Noia-1.svg" 
                data-base="Noia" 
                data-current="1" 
                data-total="5" 
                alt="Noia Score">
            
            <button class="nav-btn prev" onclick="flipPage('noia-section', -1)">&#10094;</button>
            <button class="nav-btn next" onclick="flipPage('noia-section', 1)">&#10095;</button>
          </div>

          <!-- Custom Audio Player Structure -->
          <div class="custom-audio-player">
            <!-- Notice: No 'controls' attribute, so the browser player is invisible -->
            <audio preload="metadata">
              <source src="audio/Victor Alamo - La noia i la mar.mp3" type="audio/mpeg">
            </audio>
            <button class="play-pause-btn">&#9654;</button>
            <div class="time-display"><span class="current-time">0:00</span> / <span class="duration">0:00</span></div>
            <input type="range" class="seek-bar" value="0" max="100">
          </div>

        </div>
      </section>

      <!-- Language of water -->
      <section class="composition-block" id="water-section">
        <div class="score-container">
          <div class="score-viewport">
            <img class="score-img enlargeable" 
                onclick="openLightbox('water-section')"
                title="Click to enlarge"
                src="scores/Water-1.svg" 
                data-base="Water" 
                data-current="1" 
                data-total="9" 
                alt="Water Score">
            
            <button class="nav-btn prev" onclick="flipPage('water-section', -1)">&#10094;</button>
            <button class="nav-btn next" onclick="flipPage('water-section', 1)">&#10095;</button>
          </div>

          <!-- Custom Audio Player Structure -->
          <div class="custom-audio-player">
            <audio preload="metadata">
              <source src="audio/Victor Alamo - The language of water.mp3" type="audio/mpeg">
            </audio>
            <button class="play-pause-btn">&#9654;</button>
            <div class="time-display"><span class="current-time">0:00</span> / <span class="duration">0:00</span></div>
            <input type="range" class="seek-bar" value="0" max="100">
          </div>

        </div>
      </section>

      <!-- Fada i Nina -->
      <section class="composition-block" id="fada-section">
        <div class="score-container">
          <div class="score-viewport">
            <img class="score-img enlargeable" 
                onclick="openLightbox('fada-section')"
                title="Click to enlarge"
                src="scores/Fada-1.svg" 
                data-base="Fada" 
                data-current="1" 
                data-total="15" 
                alt="Fada Score">
            
            <button class="nav-btn prev" onclick="flipPage('fada-section', -1)">&#10094;</button>
            <button class="nav-btn next" onclick="flipPage('fada-section', 1)">&#10095;</button>
          </div>

          <!-- Custom Audio Player Structure -->
          <div class="custom-audio-player">
            <audio preload="metadata">
              <source src="audio/Victor Alamo - Fada i Nina.mp3" type="audio/mpeg">
            </audio>
            <button class="play-pause-btn">&#9654;</button>
            <div class="time-display"><span class="current-time">0:00</span> / <span class="duration">0:00</span></div>
            <input type="range" class="seek-bar" value="0" max="100">
          </div>

        </div>
      </section>

      <div class="releases-container">
        
        <!-- Cosmophony -->
        <div class="release-item">
          <div class="release-media">
            <iframe class="bandcamp-iframe" scrolling="no" src="https://bandcamp.com/EmbeddedPlayer/album=1111767708/size=large/bgcol=ffffff/linkcol=333333/minimal=true/transparent=true/" seamless></iframe>
          </div>
          <div class="release-info">
            <h1 class="cosmophony-title">cosmophony</h1>
            <p>Astrophysics and music meet in this album.<br>A journey through the universe.</p>
            <div class="button-group">
              <a href="https://victoralamo.bandcamp.com/album/cosmophony" target="_blank" class="elegant-btn">Listen on Bandcamp</a>
            </div>
          </div>
        </div>

        <!-- Little Piano Pieces -->
        <div class="release-item">
          <div class="release-media">
            <img src="Little piano pieces.jpg" alt="Little piano pieces" class="release-img" style="padding-top:20px; margin-top:40px; padding-bottom:20px;">
          </div>
          <div class="release-info">
            <h1>Little piano pieces</h1>
            <p>A collection of minimalist piano pieces.<br>Available in PDF or as a printed book.</p>
            <div class="button-group">
              <a href="https://www.amazon.com/dp/B0CY2CLN5X" target="_blank" class="elegant-btn">Printed book</a>
              <a href="https://payhip.com/b/3u0r4" target="_blank" class="elegant-btn">Purchase PDF</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- THE LIGHTBOX OVERLAY -->
  <div id="score-lightbox" class="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="nav-btn prev lightbox-nav" onclick="flipLightbox(-1)">&#10094;</button>
      <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged Score">
      <button class="nav-btn next lightbox-nav" onclick="flipLightbox(1)">&#10095;</button>
    </div>
  </div>

  <!-- Custom Player Logic -->
  <script>
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return min + ":" + (sec < 10 ? "0" + sec : sec);
    }

    document.querySelectorAll('.custom-audio-player').forEach(player => {
      const audio = player.querySelector('audio');
      const playBtn = player.querySelector('.play-pause-btn');
      const currentTimeEl = player.querySelector('.current-time');
      const durationEl = player.querySelector('.duration');
      const seekBar = player.querySelector('.seek-bar');

      // Update play/pause button
      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      });

      // Listeners to update the UI button state automatically
      audio.addEventListener('play', () => {
        playBtn.innerHTML = '&#10074;&#10074;'; // Pause icon
      });

      audio.addEventListener('pause', () => {
        playBtn.innerHTML = '&#9654;'; // Play icon
      });

      // Load duration as soon as metadata is available
      audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
        seekBar.max = Math.floor(audio.duration);
      });

      // Update time and progress bar as song plays
      audio.addEventListener('timeupdate', () => {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        seekBar.value = Math.floor(audio.currentTime);
        
        // Dynamically color the track so the left side gets dark as it progresses
        const progress = (audio.currentTime / audio.duration) * 100 || 0;
        seekBar.style.background = `linear-gradient(to right, #333 ${progress}%, #e0e0e0 ${progress}%)`;
      });

      // Seek when user drags the slider
      seekBar.addEventListener('input', () => {
        audio.currentTime = seekBar.value;
      });

      // Reset when finished
      audio.addEventListener('ended', () => {
        playBtn.innerHTML = '&#9654;';
        audio.currentTime = 0;
        seekBar.value = 0;
        seekBar.style.background = '#e0e0e0';
      });
    });
  </script>
</body>
</html>
