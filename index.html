<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Alamo - Music</title>
  <meta name="description" content="The official portfolio of Victor Alamo, composer and music engraver. Discover minimalist piano pieces, orchestral scores, and original music albums.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Victor Alamo",
    "url": "https://www.victoralamo.com",
    "jobTitle": "Composer",
    "knowsAbout": ["Music Composition", "Piano", "Sheet Music", "Digital Engraving"]
  }
  </script>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar"></div>
  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;

        // hamburger menu toggle
        const toggle = document.querySelector(".menu-toggle");
        const links = document.querySelector(".nav-links");

        toggle.addEventListener("click", () => {
          links.classList.toggle("show");
        });
      });
  </script>

  <canvas id="visualizer"></canvas>

  <audio id="bg-audio" crossorigin="anonymous" autoplay>
    <source src="audio/Victor Alamo - Moon and soul.mp3" type="audio/mpeg">
  </audio>

  <button class="play-btn" id="play-btn" aria-label="Play/Pause Music">
    &#10074;&#10074; </button>

  <script>
    const audio = document.getElementById('bg-audio');
    const playBtn = document.getElementById('play-btn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    let audioContext;
    let analyser;
    let source;
    let isInitialized = false;
    
    // Animation variables for the "Seismograph"
    let smoothedVolume = 0; 
    let dataArray;
    
    // The history buffer determines how long the "landscape" is. 
    // Higher number = slower scroll & longer history visible on screen.
    const historyLength = 80; 
    let volumeHistory = new Array(historyLength).fill(0);

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initAudio() {
      if (isInitialized) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContext();
      
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256; 
      dataArray = new Float32Array(analyser.frequencyBinCount);

      source = audioContext.createMediaElementSource(audio);
      source.connect(audioContext.destination);
      source.connect(analyser); 

      isInitialized = true;
    }

    audio.addEventListener('play', () => {
      playBtn.innerHTML = '&#10074;&#10074;'; 
      playBtn.classList.remove('center-large'); 
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    });

    audio.addEventListener('pause', () => {
      playBtn.innerHTML = '&#9654;'; 
    });

    playBtn.addEventListener('click', () => {
      if (!isInitialized) initAudio();
      if (audio.paused) audio.play();
      else audio.pause();
    });

    audio.play().then(() => {
      initAudio();
    }).catch((err) => {
      playBtn.innerHTML = '&#9654;';
      playBtn.classList.add('center-large');
    });

    window.addEventListener('click', () => {
      if (!isInitialized) initAudio();
    }, { once: true });

    drawVisualizer();

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 2;

      const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
      gradient.addColorStop(0, 'rgba(51, 51, 51, 0)');
      gradient.addColorStop(0.2, 'rgba(51, 51, 51, 0.4)');
      gradient.addColorStop(0.8, 'rgba(51, 51, 51, 0.7)');
      gradient.addColorStop(1, 'rgba(51, 51, 51, 0)');
      ctx.strokeStyle = gradient;

      let currentVolume = 0;

      if (isInitialized && !audio.paused) {
        analyser.getFloatTimeDomainData(dataArray);
        let sumSquares = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sumSquares += dataArray[i] * dataArray[i];
        }
        currentVolume = Math.sqrt(sumSquares / dataArray.length);
      }

      let targetVolume = currentVolume * 5.0; 
      smoothedVolume += (targetVolume - smoothedVolume) * 0.01;

      let amplitude = Math.max(0.005, smoothedVolume);

      volumeHistory.push(amplitude);
      volumeHistory.shift(); 

      // DOWNSAMPLING
      const points = [];
      const numPoints = 4;
      const step = Math.floor(historyLength / (numPoints - 1));
      const sliceWidth = canvas.width / (historyLength - 1);
      const baseY = canvas.height * 0.55; 

      for (let i = 0; i < historyLength; i += step) {
        // Keep the spatial blur so the anchor points themselves don't jitter
        let prev2 = volumeHistory[Math.max(0, i - 2)];
        let prev1 = volumeHistory[Math.max(0, i - 1)];
        let curr  = volumeHistory[i];
        let next1 = volumeHistory[Math.min(historyLength - 1, i + 1)];
        let next2 = volumeHistory[Math.min(historyLength - 1, i + 2)];

        let spatialV = (prev2 + (prev1 * 2) + (curr * 3) + (next1 * 2) + next2) / 9;

        points.push({
          x: i * sliceWidth,
          y: baseY - (spatialV * (canvas.height * 0.4))
        });
      }

      // Ensure the very last point on the right edge is always connected
      if ((historyLength - 1) % step !== 0) {
        let lastV = volumeHistory[historyLength - 1];
        points.push({
          x: canvas.width,
          y: baseY - (lastV * (canvas.height * 0.4))
        });
      }

      // THE QUADRATIC MIDPOINT SPLINE
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      // Loop through all points and curve toward the midpoints
      for (let i = 0; i < points.length - 1; i++) {
        let xc = (points[i].x + points[i + 1].x) / 2;
        let yc = (points[i].y + points[i + 1].y) / 2;
        
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }

      // Connect the final curve smoothly to the absolute end of the screen
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.stroke();
    }
  </script>
</body>
</html>
