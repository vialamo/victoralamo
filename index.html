<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Alamo</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar"></div>
  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;

        // hamburger menu toggle
        const toggle = document.querySelector(".menu-toggle");
        const links = document.querySelector(".nav-links");

        toggle.addEventListener("click", () => {
          links.classList.toggle("show");
        });
      });
  </script>

  <!-- The Animated Canvas -->
  <canvas id="visualizer"></canvas>

  <!-- Hidden Audio Player (Autoplay enabled) -->
  <audio id="bg-audio" crossorigin="anonymous" autoplay>
    <source src="audio/Victor Alamo - Moon and soul.mp3" type="audio/mpeg">
  </audio>

  <!-- Minimalist Button at the bottom -->
  <button class="play-btn" id="play-btn" aria-label="Play/Pause Music">
    &#10074;&#10074; <!-- Unicode Pause Icon (Default state for autoplay) -->
  </button>

  <script>
    const audio = document.getElementById('bg-audio');
    const playBtn = document.getElementById('play-btn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    let audioContext;
    let analyser;
    let source;
    let isInitialized = false;
    let idleOffset = 0; // Tracks the idle animation movement

    // Set canvas to full window size
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Setup Web Audio API
    function initAudio() {
      if (isInitialized) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContext();
      
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048; // Determines the smoothness/resolution of the line

      source = audioContext.createMediaElementSource(audio);

      // Create a Low-Pass Filter to remove fast/high frequencies from the visualizer
      const filter = audioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1760; // HZ cutoff

      // Route the pristine, full audio to the speakers so the music sounds normal
      source.connect(audioContext.destination);

      source.connect(filter);
      filter.connect(analyser);

      isInitialized = true;
    }

    // Sync button icon with the actual audio state
    audio.addEventListener('play', () => {
      playBtn.innerHTML = '&#10074;&#10074;'; // Pause Icon
      playBtn.classList.remove('center-large'); // Shrink and slide to bottom
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    });

    audio.addEventListener('pause', () => {
      playBtn.innerHTML = '&#9654;'; // Play Icon
    });

    // Toggle Play/Pause on click
    playBtn.addEventListener('click', () => {
      if (!isInitialized) {
        initAudio();
      }

      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    // Attempt autoplay immediately (Browsers often block this unless the user has interacted)
    audio.play().then(() => {
      initAudio(); // Success! Initialize the visualizer
    }).catch((err) => {
      // Autoplay was blocked. Update the button to show "Play" so the user can start it manually
      console.log("Autoplay blocked by browser. Awaiting user interaction.");
      playBtn.innerHTML = '&#9654;';
      playBtn.classList.add('center-large'); // Make it large and central
    });

    // Initialize audio on any first click to ensure context resumes properly
    window.addEventListener('click', () => {
      if (!isInitialized) initAudio();
    }, { once: true });

    // Start the animation loop immediately
    drawVisualizer();

    // The Animation Loop
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);

      // Clear the canvas for the next frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Line style
      ctx.lineWidth = 1.5;

      // Create horizontal fade gradient
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
      gradient.addColorStop(0, 'rgba(51, 51, 51, 0)');
      gradient.addColorStop(0.25, 'rgba(51, 51, 51, 0.4)');
      gradient.addColorStop(0.5, 'rgba(51, 51, 51, 0.6)');
      gradient.addColorStop(0.75, 'rgba(51, 51, 51, 0.4)');
      gradient.addColorStop(1, 'rgba(51, 51, 51, 0)');

      ctx.strokeStyle = gradient;

      const points = [];

      // IDLE STATE: Draw a gentle sine wave if audio is paused or not initialized
      if (!isInitialized || audio.paused) {
        idleOffset += 0.02;
        let x = 0;
        const sliceWidth = canvas.width / 100;
        for (let i = 0; i <= 100; i++) {
          const y = (canvas.height / 2) + Math.sin((i * 0.05) + idleOffset) * 15;
          points.push({x, y});
          x += sliceWidth;
        }
      } else {
        // ACTIVE STATE: Real audio waveform data
        const bufferLength = analyser.frequencyBinCount;
        
        // Use Float32Array to eliminate 8-bit quantization (which causes the horizontal "pixelated" stair-steps)
        const dataArray = new Float32Array(bufferLength);
        
        if (analyser.getFloatTimeDomainData) {
          analyser.getFloatTimeDomainData(dataArray);
        } else {
          // Fallback for very old browsers
          const byteData = new Uint8Array(bufferLength);
          analyser.getByteTimeDomainData(byteData);
          for (let i = 0; i < bufferLength; i++) {
            dataArray[i] = (byteData[i] - 128) / 128.0;
          }
        }

        const sliceWidth = canvas.width * 1.0 / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          // Float data ranges from -1.0 to 1.0. Multiply by 1.5 to keep your wave height boost
          const v = dataArray[i] * 1.5; 
          
          // Calculate the Y position
          const waveHeight = canvas.height / 3; 
          const y = (canvas.height / 2) + (v * waveHeight);

          points.push({x, y});
          x += sliceWidth;
        }
      }

      // DRAW THE SPLINE: Smoothly connect the points using quadratic curves
      ctx.beginPath();
      if (points.length > 0) {
        ctx.moveTo(points[0].x, points[0].y);
        
        for (let i = 0; i < points.length - 1; i++) {
          // Calculate the midpoint between current point and next point
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          
          // Draw a mathematically perfect curve to that midpoint
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        
        // Draw the very last segment
        ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      }

      ctx.stroke();
    }
  </script>
</body>
</html>
